# fly.toml app configuration file generated for supah-timah
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'supah-timah'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

[mounts]
  source = 'timah_data'
  destination = '/data'

[env]
  NODE_ENV = 'production'
  DATA_DIR = '/data'
